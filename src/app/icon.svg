<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hazina Assist">
  <!-- Hazina Assist mark: a shield (bank-grade safety) holding a faceted gem
       ("hazina" — Swahili for treasure). Emerald + gold demo palette. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- rounded-square plate -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#065f46" stroke-width="2"/>

  <!-- shield -->
  <path d="M32 11 L46 16.5 V31 C46 40.5 39.7 46.9 32 51 C24.3 46.9 18 40.5 18 31 V16.5 Z"
        fill="url(#shield)" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>

  <!-- gem: crown + pavilion (kite cut) -->
  <path d="M25 27 L28.5 21 H35.5 L39 27 L32 38 Z" fill="url(#gem)" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/>

  <!-- facet lines -->
  <path d="M25 27 H39 M28.5 21 L32 38 L35.5 21" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- table sparkle -->
  <path d="M30 23.5 L32 21.5 L34 23.5" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4" stroke-linecap="round"/>
</svg>

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
spec:
  selector: { app: hazina-assist, component: app }
  ports: [{ port: 80, targetPort: {{ .Values.app.port }} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-categoriser
spec:
  selector: { app: hazina-assist, component: categoriser }
  ports: [{ port: 80, targetPort: {{ .Values.categoriser.port }} }]

# Hazina Assist — full local demo stack
#   app (Next.js, port 3000) + categoriser (DS service, 8001)
#   + Prometheus (authenticated scrape) + Grafana
# Usage:  cd deploy && docker compose up -d          (local-demo profile)
#         cd deploy && docker compose --profile operational up -d  (see notes)
#
# DATABASE: this build is SQLite-ONLY (the Prisma schema/provider targets
# SQLite; see prisma/schema.prisma). The app DB file persists in the `appdata`
# volume. PostgreSQL support is roadmap work — do not point DATABASE_URL at
# Postgres: the generated client is not provider-compatible (deep-review P1-4).
#
# MODE: the stack boots in DEPLOYMENT_MODE=demo (synthetic data, demo identity
# picker, OTP code revealed). Operational mode fails closed at startup without
# real secrets/IdP/OTP provider/durable DB — see src/lib/deployment.ts.
#
# HARDENING (deep-review P2-18):
#   - monitoring/admin images are PINNED by version (no floating `latest`);
#   - Prometheus + Grafana bind to 127.0.0.1 ONLY (no accidental LAN exposure
#     of admin surfaces); publish differently with an explicit override file;
#   - fallback secrets are accepted ONLY in the local-demo profile; the
#     operational profile refuses to start on them (fails fast, not silently);
#   - restart policies, log retention caps and resource limits are defined;
#   - backup/restore: `appdata` is a named volume — see the runbook
#     (docs/governance/runbook.md) for the tested restore procedure.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/db/custom.db}
      DEPLOYMENT_MODE: demo
      # generate a real secret for any shared/persistent deployment:
      #   openssl rand -hex 32
      HAZINA_INTENT_SECRET: ${HAZINA_INTENT_SECRET:-dev-only-secret-rotate-me}
      # scrape token — MUST match deploy/prometheus.yml `authorization.credentials`
      HAZINA_METRICS_TOKEN: ${HAZINA_METRICS_TOKEN:-dev-scrape-token-change-me}
      CATEGORISER_URL: http://categoriser:8000
    volumes:
      - appdata:/app/db
    depends_on:
      - categoriser
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      # readiness probe — DB is checked; liveness is the same endpoint with ?probe=live
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health?probe=ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  categoriser:
    build:
      context: ../services/categoriser
    ports:
      - "8001:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    # PINNED (deep-review P2-18): floating `latest` makes every `up` a surprise
    # upgrade; the version is bumped deliberately with a change note.
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    # localhost-only binding: the scrape UI must not be reachable from the LAN
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    # PINNED — same rationale as prometheus.
    image: grafana/grafana:11.5.2
    environment:
      # change for anything beyond a localhost demo
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    # localhost-only binding: the admin console must not be LAN-reachable
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------------- #
  # OPERATIONAL PROFILE — separates the local demo from any real deployment. #
  # `docker compose --profile operational up` REFUSES to boot with fallback    #
  # secrets: set HAZINA_INTENT_SECRET, HAZINA_METRICS_TOKEN, GRAFANA_PASSWORD #
  # (and a durable DATABASE_URL + OTP provider) in the environment first —    #
  # the app's own startup assertions (src/lib/deployment.ts) fail closed on   #
  # SQLite/demo secrets in operational mode, so misconfiguration is loud.     #
  # ------------------------------------------------------------------------- #
  app-operational:
    profiles: ["operational"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    ports:
      - "3000:3000"
    environment:
      DEPLOYMENT_MODE: operational
      DATABASE_URL: ${HAZINA_DATABASE_URL:?set HAZINA_DATABASE_URL to a durable external database (operational profile refuses SQLite)}
      HAZINA_INTENT_SECRET: ${HAZINA_INTENT_SECRET:?set a real HAZINA_INTENT_SECRET (fallback secrets are refused in the operational profile)}
      HAZINA_METRICS_TOKEN: ${HAZINA_METRICS_TOKEN:?set a real HAZINA_METRICS_TOKEN (fallback tokens are refused in the operational profile)}
      HAZINA_OTP_PROVIDER: ${HAZINA_OTP_PROVIDER:?set HAZINA_OTP_PROVIDER (operational mode refuses transfers without real delivery)}
      CATEGORISER_URL: http://categoriser:8000
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health?probe=ready"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  appdata:
  promdata:
  grafanadata:
